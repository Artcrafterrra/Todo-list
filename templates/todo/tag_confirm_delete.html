{% extends "base.html" %}
{% block title %}Delete Tag{% endblock %}
{% block content %}
  <h3 class="mb-3">Delete tag</h3>
  <p>Are you sure you want to delete “<b>{{ object.name }}</b>”?</p>
  <form method="post" class="mt-3 d-flex gap-2">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-outline-secondary" href="{% url 'todo:tag-list' %}">Cancel</a>
  </form>
{% endblock %}
