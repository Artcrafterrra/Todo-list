{% extends "base.html" %}
{% block title %}{% if object %}Edit Task{% else %}Create Task{% endif %}{% endblock %}
{% block content %}
  {% load crispy_forms_tags %}
  <h3 class="mb-3">{% if object %}Edit{% else %}Create{% endif %} task</h3>
  <form method="post" class="vstack gap-3">
    {% csrf_token %}
    {{ form|crispy }}
    <div>
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-secondary" href="{% url 'todo:task-list' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
